[project]
name = "datafixer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arabic-reshaper>=3.1.0",
    "charset-normalizer>=3.5.2",
    "fpdf2>=2.9.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-bidi>=0.6.12",
    "ruff>=0.17.6",
    "streamlit>=1.67.0",
    "uharfbuzz>=0.57.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
ignore = ["BLE001", "SIM102", "RUF012"]

